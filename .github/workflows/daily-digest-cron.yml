name: Daily email digest cron

on:
  schedule:
    # 10:00 AM Manila time (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force send digest even if already sent today'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-email-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install libsql-client beautifulsoup4 requests

      - name: Dispatch daily email digest
        run: |
          python scripts/daily_notifier.py ${{ inputs.force && '--force' || '' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_USER: michael18ricafrente@gmail.com
