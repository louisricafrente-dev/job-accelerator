name: Scraper sandbox validation
on:
  push:
    branches: [codex/actions-migration]
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_database tests.test_local_worker tests.test_sync_batches tests.test_execution_inbox -q
      - run: python scripts/actions_runner.py --sandbox
