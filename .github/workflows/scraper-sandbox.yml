name: Scraper sandbox validation
on:
  push:
    branches: [codex/actions-migration]
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/check_regressions.py
      - run: python scripts/actions_runner.py --sandbox
        env:
          PROXY_LIST: ${{ secrets.SCRAPER_PROXY_LIST }}
      - name: Isolated Turso inbox integration
        run: python scripts/test_turso_inbox.py
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_INTEGRATION_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_INTEGRATION_AUTH_TOKEN }}
