name: Scheduled cloud scraper

on:
  schedule:
    # Every three hours, starting at 00:00 Manila time.
    - cron: '0 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even when auto-sync is paused; preserve active worker ownership'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloud-scraper-cron
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cloud scraper with local-first awareness
        run: |
          python scripts/cloud_cron_sync.py ${{ inputs.force && '--force' || '' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PROXY_LIST: ${{ secrets.SCRAPER_PROXY_LIST }}
          SCRAPER_PROXY_LIST: ${{ secrets.SCRAPER_PROXY_LIST }}
          FLCONSOLE_MCP_TOKEN: ${{ secrets.FLCONSOLE_MCP_TOKEN }}
