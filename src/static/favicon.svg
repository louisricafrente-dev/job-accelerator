<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="60%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>

    <!-- Accelerator Cyan to Emerald Gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Drop Shadow / Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle with Cyber Glow Border -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="12" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="2 3"/>

  <!-- Energy Glow Behind Bolt -->
  <path d="M35 12 L21 34 L32 34 L28 52 L43 29 L33 29 Z" fill="#0ea5e9" opacity="0.35" filter="url(#glow)"/>

  <!-- Sharp Accelerator Lightning Bolt -->
  <path d="M35 12 L21 34 L32 34 L28 52 L43 29 L33 29 Z" 
        fill="url(#boltGrad)" 
        stroke="#ffffff" 
        stroke-width="1" 
        stroke-opacity="0.6" 
        stroke-linejoin="round"/>

  <!-- Micro Accelerator Particle Sparkles -->
  <circle cx="44" cy="15" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="18" cy="46" r="1.2" fill="#10b981" opacity="0.85"/>
</svg>
