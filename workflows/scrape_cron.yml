name: 24/7 Autonomous Job Scraper Sync

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC = 8am, 2pm, 8pm, 2am Manila Time)
    # Uses 0 quota for public repos, or only ~120 mins/month out of 2,000 for private repos.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run 15-Board Cloud Sync
        run: |
          python scripts/cloud_sync.py

      - name: Generate & Dispatch Daily Email Digest
        env:
          SMTP_USER: michael18ricafrente@gmail.com
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
        run: |
          python scripts/daily_notifier.py
          if [ -f data/latest_email_digest.html ]; then
            echo "### 🚀 Daily Job Scraping Summary" >> $GITHUB_STEP_SUMMARY
            cat data/latest_email_digest.html >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and Push Updated Database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/jobs.db data/latest_email_digest.html
          git diff-index --quiet HEAD || (git commit -m "chore(sync): automated 24/7 job sync [skip ci]" && git push)
